version: '3.8'

services:
  p10-web:
    build: .
    container_name: p10-web
    ports:
      - "80:80"
    depends_on:
      - p10-db
    networks:
      - app-network

  p10-db:
    image: mysql:8
    container_name: p10-db
    env_file:
      - .env
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - app-network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: p10-phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      PMA_HOST: p10-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - p10-db
    networks:
      - app-network
      
networks:
  app-network:
    driver: bridge